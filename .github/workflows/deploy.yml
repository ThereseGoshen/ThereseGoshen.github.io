name: Deploy build to GitHub Pages

## was looking up how to build and deploy by pushing to the main 
## this was the useful github I found: 
## https://github.com/khromov/derivault/blob/main/.github/workflows/build.yml
## for initiation of GitHub Actions for Svelte 

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18   

      - name: Install dependencies
        run: npm install

      - name: Build the code
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'   
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4